name: Build and Deploy .NET Function App - DonationFunctionApp

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'DonationFunctionApp'
  DOTNET_VERSION: '9.0' # Set to '9.0' if your project targets .NET 9

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup .NET Environment'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Build and Publish Project'
        shell: pwsh
        run: |
          dotnet build **/*.csproj --configuration Release
          dotnet publish **/*.csproj --configuration Release --output './output'

      - name: 'Deploy to Azure Function App'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: './output'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
