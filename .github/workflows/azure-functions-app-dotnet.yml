name: Deploy Donation Function App


on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'DonationFunctionApp'
  DOTNET_VERSION: '9.0' # Change to '9.0' if your project targets .NET 9

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup .NET Environment'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Build and Publish Project'
        shell: pwsh
        run: |
          $proj = (Get-ChildItem -Recurse -Filter *.csproj).FullName
                    dotnet build $proj --configuration Release
                    dotnet publish $proj --configuration Release --output './output'

      - name: 'Deploy to Azure Function'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: './output'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
