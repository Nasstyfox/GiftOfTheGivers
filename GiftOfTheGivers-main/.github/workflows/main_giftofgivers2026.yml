trigger:
- master

pool:
  name: 'Default'  # Uses your self-hosted agent to bypass Azure parallelism limits

variables:
  azureServiceConnection: 'sub-ter-rcwcct-rosebankcollege-studrsg-dts-001'  # The service connection created in Project Settings
  functionAppName: 'DonationFunctionApp'
  buildConfiguration: 'Release'

steps:
- task: DotNetCoreCLI@2
  displayName: 'Build & Publish Project'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

- task: AzureFunctionApp@1
  displayName: 'Deploy to Azure Function App'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    appType: 'functionApp'
    appName: '$(functionAppName)'
    package: '$(Build.ArtifactStagingDirectory)/*.zip'