name: Deploy Donation Function App

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'DonationFunctionApp'
  DOTNET_VERSION: '8.0' # Set to '9.0' if your C# project uses .NET 9

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup .NET Environment'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Build and Publish .NET App'
        shell: pwsh
        run: |
          dotnet build **/*.csproj --configuration Release
          dotnet publish **/*.csproj --configuration Release --output './publish'

      - name: 'Deploy to Azure Function'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: './publish'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
