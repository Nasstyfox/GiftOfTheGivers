trigger:
- main

pool:
  name: 'Default'  # Uses your local self-hosted agent

variables:
  azureServiceConnection: 'sub-ter-rcwcct-rosebankcollege-studrsg-dts-001'  # Replace with the exact name created in Step 2
  functionAppName: 'DonationFunctionApp'
  buildConfiguration: 'Release'

steps:
# Step 1: Build & Package the .NET Function Project
- task: DotNetCoreCLI@2
  displayName: 'Build & Publish Project'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

# Step 2: Deploy to Azure
- task: AzureFunctionApp@1
  displayName: 'Deploy to Azure Function App'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    appType: 'functionApp'
    appName: '$(functionAppName)'
    package: '$(Build.ArtifactStagingDirectory)/*.zip'
